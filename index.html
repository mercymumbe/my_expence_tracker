<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="header">
        <div class="container header-content">
            <div>
                <h1>PERSONAL EXPENSE TRACKER</h1>
            </div>
        </div>
    </header>
    <!-- main section -->
    <main class="dashboard">
        <!-- Total expenses card -->
        <section class="balance-card">
            <div>
                <p class="summary-card">Total Expenses</p>
                <h2 class="totalAmount">KES 0.00</h2>
            </div>

            <div>
                <p class="summary-card">Today</p>
                <h2 class="totalAmount">KES 0.00</h2>
            </div>
        </section>
        <section class="panel">
        
                <h2>Add a new expense</h2>
                 <form id="expenseForm">
                    <div class="form-grid">
                        <div class="form-card">
                        <label for="description"><strong>Description:</strong></label>
                        <input type="text" id="description" placeholder="e.g. Lunch"  required>
                    </div>
                    <br>
                    <div class="form-card">
                        <label for="amount"><strong>Amount (KSh):</strong></label>
                        <input type="number" id="amount" placeholder="e.g. 500" min="0.01" step="0.01" required>
                    </div>
                    <br>
                    <div class="form-card">
                        <label for="category"><strong>Category:</strong></label>
                        <select id="category" required>
                            <option value="">Select category</option>
                            <option value="Food">Food</option>
                            <option value="Transport">Transport</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Bills">Bills</option>
                            <option value="Health">Health</option>
                            <option value="Education">Education</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <br>
                    <div class="form-card">
                        <label for="expenseDate"><strong>Expense date:</strong></label>
                        <input type="date" id="expenseDate" required>
                    </div>
                    </div>
                 </form>
        </section>

        <script src="script.js"></script>
</body>

</html>
